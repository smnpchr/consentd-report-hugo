baseURL = "/"
title = "consentd Reports"
enableGitInfo = false
defaultContentLanguage = "de"

[params]
  BookTheme = "auto"
  BookToC = true
  BookSection = "reports"
  BookMenuBundle = "/reports"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = false

# Import theme with filtered static files (exclude mermaid, katex, asciinema)
[[module.imports]]
  path = "hugo-book"

  [[module.imports.mounts]]
    source = "static"
    target = "static"
    files = ["favicon.*", "fuse.min.mjs"]

  [[module.imports.mounts]]
    source = "assets"
    target = "assets"

  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"

  [[module.imports.mounts]]
    source = "i18n"
    target = "i18n"

  [[module.imports.mounts]]
    source = "data"
    target = "data"

  [[module.imports.mounts]]
    source = "archetypes"
    target = "archetypes"
