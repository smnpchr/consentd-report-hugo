baseURL = "/"
title = "consentd Reports"
enableGitInfo = false
defaultContentLanguage = "de"

[params]
  BookTheme = "auto"
  BookToC = true
  BookSection = "reports"
  BookMenuBundle = "/reports"

# Patient-based taxonomy: one term per patient id, listing every sync run
# in which that id appears. Declaring [taxonomies] also disables Hugo's
# default tags/categories taxonomies (which we don't use).
[taxonomies]
  patient = "patients"

# Sidebar link to the patient overview, rendered by the Hugo Book theme
# via docs/menu-hugo from .Site.Menus.after. pageRef (not url) so Hugo
# derives the link from the taxonomy page's RelPermalink — this lets the
# offline build rewrite it to a relative .../patients/index.html path.
[[menu.after]]
  name = "Patienten"
  pageRef = "/patients"
  weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = false

# Import theme with filtered static files (exclude mermaid, katex, asciinema)
[[module.imports]]
  path = "hugo-book"

  [[module.imports.mounts]]
    source = "static"
    target = "static"
    files = ["favicon.*", "fuse.min.mjs"]

  [[module.imports.mounts]]
    source = "assets"
    target = "assets"

  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"

  [[module.imports.mounts]]
    source = "i18n"
    target = "i18n"

  [[module.imports.mounts]]
    source = "data"
    target = "data"

  [[module.imports.mounts]]
    source = "archetypes"
    target = "archetypes"
